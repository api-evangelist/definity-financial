regulatory_context:
  prudential: Office of the Superintendent of Financial Institutions (OSFI), federal
  conduct:
  - Financial Services Regulatory Authority of Ontario (FSRA)
  - Autorite des marches financiers (AMF), Quebec
  open_data_mandate: >-
    None. Canada's Consumer-Driven Banking framework excludes insurance entirely, so no
    open-insurance mandate forces a public API surface. Standardization in Canadian P&C is
    industry-led through CSIO rather than regulator-mandated — which is exactly why the CSIO
    certifications above are the meaningful conformance signal for this carrier.
