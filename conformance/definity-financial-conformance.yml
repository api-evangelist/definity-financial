generated: '2026-07-25'
method: searched
source: https://csio.com/csio-certification/certified-members
summary: >-
  Definity Financial publishes no machine-readable API contract of any kind, so none of the
  spec-level conformance assertions below can be evidenced from a first-party artifact.
  What Definity DOES have is third-party, verifiable certification against the Canadian
  property-and-casualty industry's own API standards body: CSIO (Centre for Study of
  Insurance Operations, csio.com), the Canadian counterpart to ACORD. Definity is listed by
  CSIO as API Security Standards Certified, eDocs Certified and Compliance Certified. This
  corrects the earlier round of this profile, which recorded CSIO membership/certification as
  "could not be confirmed" — it is now confirmed on CSIO's own certified-members register and
  in CSIO's dated news releases.
standards:
- id: csio-api-security-standards
  name: CSIO API Security Standards
  conforms: true
  certified: true
  certified_on: '2024-11-27'
  body: Centre for Study of Insurance Operations (CSIO)
  scope: Insurer-to-broker-management-system (BMS) API connectivity
  evidence: >-
    CSIO news release "CSIO Congratulates Definity Financial Corporation for Achieving API
    Security Standards Certification" (2024-11-27) and CSIO's certified-members register,
    which lists Definity under "API Security Standards Certified (Insurer)". The Standards
    were built by CSIO's INNOTECH Advisory Committee and its API Security Working Group and
    define a standard authentication and authorization API model for insurers and BMS
    vendors; certification requires confirmed prevention of 16 OAuth security concerns and
    18 API endpoint concerns.
  sources:
  - https://csio.com/news/csio-congratulates-definity-financial-corporation-achieving-api-security-standards
  - https://csio.com/csio-certification/certified-members
  - https://www.insurancebusinessmag.com/ca/news/technology/definity-earns-csio-api-security-certification-515841.aspx
