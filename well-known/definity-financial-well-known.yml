summary: >-
  No RFC 9116 security.txt, no OIDC discovery document, no RFC 8414 authorization-server
  metadata, no RFC 9727 api-catalog and no ai-plugin.json is published on any Definity
  Financial host. Two brand hosts DO publish a real, hand-authored llms.txt at the site
  root (www.sonnet.ca and www.economical.com); both are saved verbatim under llms/.
  Three responses are 200 but are NOT the requested document and must not be mistaken
  for one: www.definityfinancial.com returns the eleven-byte string "Invalid key" for any
  /.well-known/ path, and www.petsecure.com returns its full HTML page shell (~25 KB) for
  any unknown path. Both are recorded below as false positives.
