actions:
  apisYmlCreated: true
  apisListed: 0
  openapiHarvested: false
  reason: >-
    No public self-serve developer portal, no downloadable OpenAPI/Swagger/GraphQL/
    AsyncAPI definition, and no public Postman collection exist for Definity Financial
    or any of its brands. The apis[] array is intentionally empty. Recording the
    partner-gated absence accurately is the correct outcome for this carrier.
