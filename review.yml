- url: https://www.definityfinancial.com/
  type: Website
  note: Corporate homepage. Confirms brands Economical, Sonnet, Family, Petline; no developer or API links in navigation.
- url: https://www.definityfinancial.com/investors
  type: Website
  note: >-
    Confirms $6.3B gross written premiums TTM pro forma including the Travelers Canada
    transaction, Sonnet described as the largest fully digital direct-to-consumer
    insurance business in Canada, and Vyne named as the broker operations platform.
- url: https://en.wikipedia.org/wiki/Economical_Insurance
  type: Reference
  note: >-
    Founding 1871 in Berlin (now Kitchener) Ontario, demutualization vote May 2021, IPO
    November 2021, rename to Definity Insurance Company December 2021, headquarters
    Waterloo Ontario, TSX ticker DFY.
- url: http://csio.com/
  type: Standard
  note: >-
    Canada's P&C standards body. Maintains eDocs, EDI, XML, XML Dataset, JSON, API
    Security and Commercial Lines Data Standards plus CSIOnet and My Proof of
    Insurance. Definity/Economical not named on the reachable public pages.
