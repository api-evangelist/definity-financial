name: Definity Financial
kind: company
description: >-
  Definity Financial Corporation is a Canadian property and casualty insurance group
  headquartered in Waterloo, Ontario and listed on the Toronto Stock Exchange (DFY).
  It is the demutualized successor to Economical Mutual Insurance Company, founded in
  1871 in Berlin (now Kitchener), Ontario; policyholders approved demutualization in
  May 2021 and the company completed its IPO in November 2021, renaming the operating
  carrier Definity Insurance Company. Definity underwrites personal and commercial
  property, automobile, farm, and pet lines across Canada through four brands:
  Economical (broker-distributed home, auto, farm and business insurance), Sonnet
  (described by the company as the largest fully digital direct-to-consumer insurance
  business in Canada), Family Insurance Solutions, and Petline/Petsecure (pet
  insurance). It is one of the Big Few Canadian P&C carriers and reported roughly
  $6.3B in gross written premiums on a trailing-twelve-month pro-forma basis
  including its Travelers Canada acquisition. Its API posture is partner-gated and
  honest to state plainly: Definity publishes no public, self-serve developer portal
  and no downloadable OpenAPI, Swagger, GraphQL, or AsyncAPI definition on any
  first-party host. Every developer-shaped subdomain of definityfinancial.com fails to
  resolve, an api.definity.com host exists behind Imperva but answers HTTP 404 with an
  empty body to every anonymous path including OAuth and OpenID discovery, and the
  only reachable broker surface, broker.economical.com, is a Docebo learning
  management system for broker training rather than an API reference. The gated API is
  nonetheless real and independently attested: CSIO, Canada's property-and-casualty
  data-standards body and the domestic counterpart to ACORD, certified Definity against
  its API Security Standards on 27 November 2024 — the industry's standard authentication
  and authorization API model for insurer-to-broker-management-system connectivity,
  requiring confirmed mitigation of 16 OAuth security concerns and 18 API endpoint
  concerns — and Definity is additionally CSIO eDocs Certified and Compliance Certified
  (all non-standard Z-Codes eliminated from broker data exchange). Its Vyne broker digital
  platform runs on Guidewire Cloud, which Definity was the first Canadian P&C insurer to
  adopt for its core insurance platform. Two brands, Sonnet and Economical, publish real
  hand-authored llms.txt documents with explicit AI-training, generation, summarization and
  crawling directives, including named directives for OpenAI, Google-DeepMind and Anthropic.
  All of this sits in a Canadian market where OSFI supervises prudentially, the provinces
  regulate conduct, and Consumer-Driven Banking excludes insurance entirely, so no
  open-insurance mandate forces a public API surface and standardization is industry-led
  through CSIO instead.
